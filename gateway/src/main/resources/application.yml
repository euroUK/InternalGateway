server:
  port: 8080

spring:
  application:
    name: internal-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record

gateway:
  dsl-path: ${GATEWAY_DSL_PATH:../dsl}
  envelope-secret: ${GATEWAY_ENVELOPE_SECRET:poc-envelope-secret-min-32-chars!!}
  cors-allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  services:
    deposit-offer-service: ${DEPOSIT_OFFER_SERVICE_URL:http://localhost:8090}
    test-processor: ${TEST_PROCESSOR_URL:http://localhost:8092}
    document-service: ${DOCUMENT_SERVICE_URL:http://localhost:8092}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:8093}
  envelope:
    issuer: internal-gateway
    ttl-seconds: 30
    business-control-evidence-id: poc-stub-passed
  dedup:
    maximum-size: 10000
    default-ttl: 7d
  resilience:
    backoff:
      base-ms: 100
      jitter-ms: 50
  observability:
    trace-buffer-size: 500
    top-routes-limit: 10
  kafka:
    listener-bindings:
      - deposit-processor-offer-lifecycle
      - test-processor-offer-lifecycle
  test-harness:
    default-binding-id: test-processor-offer-lifecycle
    fault-path: /internal/test/fault
    default-fault-status: 503
    demo-publish-path: /demo/publish-offer-event

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

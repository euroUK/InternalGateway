server:
  port: 8090

spring:
  application:
    name: deposit-offer-service
  datasource:
    url: jdbc:h2:file:${H2_DATABASE_PATH:./data/offers};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

offer-service:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

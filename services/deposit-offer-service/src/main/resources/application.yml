  fault:
    enabled: ${OFFER_SERVICE_FAULT_ENABLED:true}
    path-prefix: ${OFFER_SERVICE_FAULT_PATH_PREFIX:/internal/v1/events/deposit-processor/}
    default-status: ${OFFER_SERVICE_FAULT_DEFAULT_STATUS:503}

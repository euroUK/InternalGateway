services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: poc-kafka
    networks:
      - front-system
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  deposit-offer-service:
    build:
      context: .
      dockerfile: services/deposit-offer-service/Dockerfile
    container_name: poc-deposit-offer-service
    networks:
      - front-system
    environment:
      GATEWAY_URL: http://gateway:8080
      H2_DATABASE_PATH: /data/offers
    volumes:
      - offer-service-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  deposit-processor:
    build:
      context: .
      dockerfile: services/deposit-processor/Dockerfile
    container_name: poc-deposit-processor
    networks:
      - front-system
    ports:
      - "8091:8091"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PROCESSOR_TOPIC: deposit.processor.offer.lifecycle.v1
      PROCESSOR_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  test-processor:
    build:
      context: .
      dockerfile: services/test-processor/Dockerfile
    container_name: poc-test-processor
    networks:
      - front-system
    ports:
      - "8092:8092"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PROCESSOR_TOPIC: test.processor.offer.lifecycle.v1
      PROCESSOR_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: poc-gateway
    networks:
      - front-system
    ports:
      - "8080:8080"
    volumes:
      - ./dsl:/config/dsl:ro
    environment:
      GATEWAY_DSL_PATH: /config/dsl
      DEPOSIT_OFFER_SERVICE_URL: http://deposit-offer-service:8090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PROCESSOR_TOPIC: deposit.processor.offer.lifecycle.v1
      KAFKA_CONSUMER_GROUP: internal-gateway.front-system.deposit-processor-offers
      KAFKA_ACTIVE_BINDING_ID: deposit-processor-offer-lifecycle
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000
      GATEWAY_ENVELOPE_SECRET: poc-envelope-secret-min-32-chars!!
    depends_on:
      kafka:
        condition: service_healthy
      deposit-offer-service:
        condition: service_healthy
      test-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 50s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poc-frontend
    networks:
      - front-system
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
      deposit-processor:
        condition: service_healthy

networks:
  front-system:
    name: front-system

volumes:
  offer-service-data:
